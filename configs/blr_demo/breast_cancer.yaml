# BLR + NDIS demo config for Wisconsin Diagnostic Breast Cancer dataset.
#
# Runs Bayesian Logistic Regression (Definition 7) wrapped with the
# NDIS-Calibrated Gaussian Mechanism (Figure 5) at several epsilon values.
# Labels: {-1, +1}  (malignant = +1, benign = -1)
#
# Usage:
#   python scripts/run_blr_ndis_demo.py --config configs/blr_demo/breast_cancer.yaml

dataset: breast_cancer

# Privacy grid
epsilon_grid: [1.0]
delta_rule: "1e-5"        

# BLR regularization (Proposition 7 requires lambda > 0)
lambda_reg: 3.0

# Multiple seeds for variance estimation
seeds: [2734335219, 2905568749, 2703185305, 3085492084, 1659915345]


# Train/test split
split:
  train_fraction: 0.8
  seed: 42

# Preprocessing
# scale_x: standardize features (fit on train only)
# clip_x:  clip each train/test row to l2 norm <= clip_x_bound
# clip_y is IGNORED for classification (binary labels)
preprocess:
  scale_x: true
  clip_x: true
  clip_x_bound: 1.5

# Where to save JSONL records
output_root: data/outputs/blr_ndis_runs
