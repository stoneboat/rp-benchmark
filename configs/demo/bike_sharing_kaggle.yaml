# Combined Kaggle Bike Sharing Demand comparison config.
#
# Required local data file:
#   data/raw/bike_sharing_kaggle/bike_train.csv
# or override via:
#   dataset_params:
#     csv_path: /absolute/or/relative/path/to/bike_train.csv
#
# Exact to GaussMix on the dataset side:
# - Kaggle bike_train.csv source
# - split seed 50 with permutation-based 80/20 split
# - one-hot season/weather + datetime-derived features
# - y scaled by max(abs(y_train))
# - X scaled by max training-row L2 norm
#
# Runs the same dataset setup across native RP-family mechanisms so they can be
# compared in one benchmark/report.

dataset: bike_sharing_kaggle
mechanisms: [Mech_RP, Mech_Sheffet_RP, Mech_Improved_Sheffet_RP, Mech_Modified_GaussMix]
task: OLSFromRelease
epsilon_grid:
  [0.1, 0.3, 0.5, 1.0, 1.3, 1.5, 2.0]
delta_rule: 1e-6
seed_batch:
  mode: fixed
  base_seed: 50
  count: 20
split:
  train_fraction: 0.8
  seed: 50
preprocess:
  scale_x: false
  clip_x: false
  clip_x_bound: 1.0
  clip_y: false
  clip_y_bound: 1.0
  missing_policy: drop
mech_params:
  Mech_RP:
    r: 57
  Mech_RP_PTR:
    r: 57
    tau: 1.0
    delta_r: 5.0e-07
    delta_t: 3.0e-07
    delta_ptr: 2.0e-07
  Mech_Sheffet_RP:
    r: 57
  Mech_Improved_Sheffet_RP:
    r: 57
  Mech_Modified_GaussMix:
    r: 57
output_root: data/outputs/runs/bike_sharing_kaggle
