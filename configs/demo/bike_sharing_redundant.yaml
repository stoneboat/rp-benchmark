# Bike sharing with each training row repeated `copies_per_row` times (same OpenML
# source as bike_sharing). Inflates n for redundant-row regimes; test split unchanged.
dataset: bike_sharing_redundant
dataset_params:
  copies_per_row: 15
mechanisms: [Mech_RP, Mech_RP_Pois]
task: OLSFromRelease
epsilon_grid: [0.5, 1.0, 2.0, 4.0]
delta_rule: 1e-6
seed_batch:
  mode: fixed
  base_seed: 0
  count: 5
split:
  train_fraction: 0.8
  seed: 42
preprocess:
  scale_x: true
  clip_x: true
  clip_x_bound: 3.0
  clip_y: true
  clip_y_bound: 1.0
  missing_policy: drop
mech_params:
  Mech_RP:
    r: 100
  Mech_RP_Pois:
    r: 100
    q: 0.8
  Blocki12_JL:
    r: 100
output_root: data/outputs/runs/bike_sharing_redundant

# you can then run 
# ```python scripts/build_report.py --input-root data/outputs/runs/bike_sharing_redundant  --output-root data/outputs/runs/bike_sharing_redundant ```
# to build the report 
