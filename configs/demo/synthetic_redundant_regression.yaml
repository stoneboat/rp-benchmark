# Combined synthetic redundant-regression comparison config.
#
# Uses the same dataset setup for all native RP-family mechanisms so they can be
# compared under a single run/report.
dataset: synthetic_redundant_regression
dataset_params:
  feature_dim: 12
  n_prototypes: 60
  copies_per_prototype: 100
  cluster_noise: 0.025
  label_noise: 0.05
  generation_seed: 12345
  prototype_eigenvalues: [1.60, 1.30, 1.05, 0.86, 0.70, 0.57, 0.46, 0.37, 0.30, 0.24, 0.19, 0.15]
  beta_mode: mid_weak
  beta_strength: 1.5
  beta_midpoint: 0.72
  beta_bandwidth: 0.16
  poisson_diag_qs: [0.2, 0.3, 0.5, 0.8, 0.9]
  poisson_diag_trials: 25
  poisson_diag_seed: 4242
  blocki12_jl_diag_rs: [20, 30]
  blocki12_jl_diag_trials: 25
  blocki12_jl_diag_seed: 4243
mechanisms: [Mech_RP, Mech_RP_Pois, Mech_Sheffet_RP, Mech_Improved_Sheffet_RP, Mech_Modified_GaussMix]
task: OLSFromRelease
epsilon_grid: [0.1, 0.25, 0.5, 1.0]
delta_rule: 1e-6
seed_batch:
  mode: fixed
  base_seed: 0
  count: 8
split:
  train_fraction: 0.8
  seed: 42
preprocess:
  scale_x: true
  clip_x: true
  clip_x_bound: 3.0
  clip_y: true
  clip_y_bound: 1.0
  missing_policy: drop
mech_params:
  Mech_RP:
    r: 20
  Mech_RP_Pois:
    r: 20
    q: 0.3
  Mech_Sheffet_RP:
    r: 20
  Mech_Improved_Sheffet_RP:
    r: 20
  Mech_Modified_GaussMix:
    r: 20
output_root: data/outputs/runs/synthetic_redundant_regression
