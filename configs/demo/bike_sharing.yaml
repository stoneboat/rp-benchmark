dataset: bike_sharing
mechanisms: [Mech_RP, Mech_RP_Pois, Blocki12_JL]
task: OLSFromRelease
epsilon_grid: [0.5, 1.0, 2.0, 4.0]
delta_rule: 1e-6
seed_batch:
  mode: fixed
  base_seed: 0
  count: 5
split:
  train_fraction: 0.8
  seed: 42
preprocess:
  scale_x: true
  clip_x: true
  clip_x_bound: 3.0
  clip_y: true
  clip_y_bound: 1.0
  missing_policy: drop
mech_params:
  Mech_RP:
    r: 30
  Mech_RP_Pois:
    r: 30
    q: 0.8
  Blocki12_JL:
    r: 30
output_root: data/outputs/runs/bike_sharing
