# Kaggle Bike Sharing Demand comparison between the native RP mechanism and the
# native improved Sheffet-style RP mechanism.
#
# Uses the same GaussMix-like bike adapter already present in the repo, while
# keeping the run size moderate enough for report generation.
dataset: bike_sharing_kaggle
mechanisms: [Mech_RP, Mech_Improved_Sheffet_RP]
task: OLSFromRelease
epsilon_grid:
  [0.063095734448, 0.218776162395, 0.758577575029, 2.6302679919, 9.12010839356, 31.6227766017]
delta_rule: 1e-5
seed_batch:
  mode: fixed
  base_seed: 50
  count: 20
split:
  train_fraction: 0.8
  seed: 50
preprocess:
  scale_x: false
  clip_x: false
  clip_x_bound: 1.0
  clip_y: false
  clip_y_bound: 1.0
  missing_policy: drop
mech_params:
  Mech_RP:
    r: 57
  Mech_Improved_Sheffet_RP:
    r: 57
output_root: data/outputs/runs/bike_sharing_kaggle_improved_sheffet
