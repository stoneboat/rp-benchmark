# Scalar-output GPR with the application-specific exact-NDIS covariance path.
#
# This preserves the submitted Table 1 protocol from linnerud.yaml while using
# the published legacy release seeds 42--46. The generic config remains
# unchanged and continues to default to the corrected generic wrapper.

dataset: linnerud

dataset_params:
  target_index: 2

# Select the scalar specialization explicitly. Omitting this key keeps the
# standalone demo on the generic Definition-6 calibration path.
calibration_mode: scalar_gpr_exact

# Privacy parameters
epsilon: 1.0
delta_rule: "1e-5"

# RBF kernel hyperparameters
kernel: rbf
lengthscale: 5.0

# Observation noise variance sigma_n^2 and public sensitivity bounds
sigma_n2: 250.0
l_bound: 1.0
B_bound: 0.5

# Fixed public query point from the test split
x_star_source: test
x_star_index: 0

# Published legacy seeds used for the submitted Table 1 comparison
seeds: [42, 43, 44, 45, 46]

split:
  train_fraction: 0.8
  seed: 42

preprocess:
  scale_x: true
  clip_x: true
  clip_x_bound: 3.0
  clip_y: true
  clip_y_bound: 0.5

output_root: data/outputs/gpr_scalar_exact_ndis_runs
